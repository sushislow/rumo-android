plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.rumo.diario'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'br.com.rumo.diario'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.4.0-beta'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Chave privada fornecida pelo GitHub Actions; nunca colocada no repositório.
    signingConfigs {
        rumoRelease {
            if (System.getenv('RUMO_KEYSTORE_PATH')) {
                storeFile file(System.getenv('RUMO_KEYSTORE_PATH'))
                storePassword System.getenv('RUMO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RUMO_KEY_ALIAS')
                keyPassword System.getenv('RUMO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.rumoRelease
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation platform('com.google.firebase:firebase-bom:34.5.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
