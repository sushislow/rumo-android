<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1521">
  <meta name="description" content="Diário pessoal e privado para acompanhar hábitos, gatilhos e seu progresso, um dia de cada vez.">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <title>Rumo — Diário de progresso</title>
  <style>
    :root { --bg:#0b1421;--panel:#111f2e;--panel-alt:#17283a;--border:#284054;--muted:#a1b3c4;--text:#eff8fb;--mint:#78e1bb;--mint-dark:#173f38;--coral:#ffaba1;--coral-dark:#4e2c32;--lavender:#c5b2ff;--lavender-dark:#312c50;--cream:#fff0ce;--shadow:0 16px 45px rgba(0,0,0,.16);}
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--text);background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid var(--lavender);outline-offset:3px; }
    button:disabled { cursor:not-allowed;opacity:.35; }
    .wrap { max-width:880px; margin:0 auto; padding:25px 20px 120px; }
    .brand { display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 23px; }
    .brand-main { display:flex;align-items:center;gap:12px; }
    .symbol { display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(140deg,#86f1c4,#4ac8b0);color:#10342f;box-shadow:0 8px 30px #2aa98f33; }
    .symbol svg { width:24px;height:24px; }
    .brand-name { font-size:1.18rem;font-weight:800;letter-spacing:.3px;line-height:1; }
    .brand-sub { color:var(--muted);font-size:.75rem;margin-top:4px; }
    .privacy { font-size:.75rem;color:var(--mint);border:1px solid #336859;background:#14372f;border-radius:40px;padding:7px 10px;white-space:nowrap;display:flex;align-items:center;gap:5px; }
    .privacy:before { content:"";width:6px;height:6px;background:var(--mint);border-radius:50%; }
    .hero { position:relative;overflow:hidden;background:linear-gradient(115deg,#173c3a,#132d3d 65%,#1a2846);padding:29px 26px 27px;border:1px solid #315451;border-radius:23px;margin-bottom:18px; }
    .hero:after { content:"";position:absolute;right:-66px;top:-93px;border:1px solid #8ee4cf3d;border-radius:50%;width:230px;height:230px;box-shadow:0 0 0 32px #8ee4cf09,0 0 0 75px #8ee4cf07;pointer-events:none; }
    .eyebrow { color:var(--mint);font-size:.79rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px; }
    h1 { font-size:clamp(1.75rem,4vw,2.45rem);letter-spacing:-.036em;line-height:1.12;margin:0 0 12px;max-width:520px; }
    .hero p:last-of-type { margin:0;color:#c4dce0;font-size:.95rem;max-width:540px; }
    .hero .hero-actions { margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1; }
    .btn { display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;padding:11px 15px;border-radius:11px;font-weight:700;font-size:.88rem;min-height:43px;text-decoration:none;transition:background .15s, transform .15s,color .15s; }
    .btn:active { transform:translateY(1px); }
    .btn-primary { background:var(--mint);color:#10312d; }
    .btn-primary:hover { background:#98edcd; }
    .btn-secondary { background:#263c48;color:#f4faff;border-color:#385562; }
    .btn-secondary:hover { background:#345061; }
    .btn-ghost { background:transparent;color:var(--mint);border-color:#456a68; }
    .btn-ghost:hover { background:#1c3b39; }
    .btn-danger { background:var(--coral-dark);color:#ffc6c0;border-color:#a55b62; }
    .btn-small { font-size:.81rem;padding:8px 11px;min-height:36px; }
    .cards { display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:12px;margin:0 0 19px; }
    .stat { background:var(--panel);border:1px solid var(--border);padding:17px 19px;border-radius:16px;min-width:0; }
    .stat-label { color:var(--muted);font-size:.78rem;line-height:1.35; }
    .stat-val { font-size:1.85rem;letter-spacing:-.06em;font-weight:790;line-height:1.25;margin-top:4px; }
    .stat-detail { color:#b7c8d6;font-size:.72rem; }
    .panel { background:var(--panel);border:1px solid var(--border);border-radius:19px;padding:23px;margin-bottom:17px;box-shadow:var(--shadow); }
    .panel h2 { font-size:1.24rem;letter-spacing:-.025em;margin:0 0 5px; }
    .panel .description { font-size:.87rem;color:var(--muted);margin:0 0 20px; }
    .panel-head { display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px; }
    .panel-head h2 { margin:0; }
    .month-nav { display:flex;align-items:center;gap:10px; }
    .icon-btn { background:var(--panel-alt);border:1px solid var(--border);border-radius:10px;min-width:37px;min-height:37px;color:var(--text);font-size:1.25rem;line-height:1;display:grid;place-items:center; }
    .icon-btn:hover:not(:disabled) { background:#244057; }
    .month-name { min-width:140px;text-align:center;font-size:.99rem;font-weight:750;text-transform:capitalize; }
    .weekdays { display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-bottom:8px; }
    .weekdays div { text-align:center;color:var(--muted);font-size:.76rem;font-weight:650; }
    .calendar { display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px; }
    .day { position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:62px;flex-direction:column;gap:3px;border:1px solid #2a4053;color:var(--text);background:#182839;border-radius:11px; }
    .day .number { font-size:.94rem;font-weight:700; }
    .day .dot { width:6px;height:6px;border-radius:50%;background:transparent; }
    .day.outside { opacity:.32;background:transparent; }
    .day.done { background:var(--mint-dark);border-color:#346e5f; }
    .day.done .number { color:#a9f4d5; }
    .day.done .dot { background:var(--mint); }
    .day.slip { background:var(--coral-dark);border-color:#895057; }
    .day.slip .number { color:#ffd0cb; }
    .day.slip .dot { background:var(--coral); }
    .day.partial { background:var(--lavender-dark);border-color:#65558c; }
    .day.partial .dot { background:var(--lavender); }
    .day.today { outline:2px solid #a3bfd0;outline-offset:1px; }
    .day.selected { box-shadow:inset 0 0 0 2px var(--cream); }
    .day:not(.outside):hover:not(:disabled) { filter:brightness(1.16); }
    .legend { display:flex;flex-wrap:wrap;gap:15px;margin-top:17px;color:#b4c6d6;font-size:.8rem; }
    .legend-item { display:flex;align-items:center;gap:7px; }
    .swatch { width:12px;height:12px;border-radius:4px;background:#233a4d;border:1px solid #426074; }
    .swatch.done { background:var(--mint);border-color:var(--mint); }
    .swatch.slip { background:var(--coral);border-color:var(--coral); }
    .swatch.partial { background:var(--lavender);border-color:var(--lavender); }
    .soft-note { color:#b9cdd5;font-size:.86rem;margin:15px 0 0; }
    .hint { background:#1a303d;border-left:3px solid #74cfb9;border-radius:0 10px 10px 0;padding:13px 15px;color:#cadbdc;font-size:.85rem;margin-bottom:18px; }
    .section-title { font-size:1.48rem;line-height:1.2;letter-spacing:-.028em;margin:3px 0 8px; }
    .section-sub { font-size:.9rem;color:var(--muted);margin:0 0 18px; }
    .field { margin-bottom:22px; }
    .field-head { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px; }
    .field-title { font-size:.92rem;font-weight:700; }
    .field-sub { margin:4px 0 11px;font-size:.78rem;color:var(--muted); }
    .status-group { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px; }
    .option { display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #385268;background:#1b3041;min-height:64px;padding:10px 6px;border-radius:12px;color:#c6d7e3;font-size:.84rem;font-weight:700;cursor:pointer; }
    .option input { position:absolute;opacity:0;width:1px;height:1px; }
    .option:has(input:checked) { border-color:#a5e9d1;background:#1b413a;color:#baf7de;box-shadow:0 0 0 1px #64d0a6; }
    .option.slip:has(input:checked) { background:#4a2d34;border-color:#ffb2a9;color:#ffd9d5;box-shadow:0 0 0 1px #ff9a8f; }
    .option:has(input:focus-visible) { outline:3px solid var(--lavender);outline-offset:2px; }
    .chips { display:flex;flex-wrap:wrap;gap:8px; }
    .chip { position:relative;border:1px solid #385368;padding:9px 13px;border-radius:30px;color:#c0d3df;font-size:.81rem;background:#1b3041;cursor:pointer; }
    .chip input { position:absolute;opacity:0;width:1px;height:1px; }
    .chip:has(input:checked) { background:#24483f;color:#bdf1dd;border-color:#73d6b4; }
    .chip:has(input:focus-visible) { outline:3px solid var(--lavender);outline-offset:2px; }
    .checkline { display:flex;align-items:flex-start;gap:11px;font-size:.88rem;color:#deecf4;padding:10px 0;cursor:pointer; }
    .checkline input { margin-top:3px;accent-color:#6bdab3;width:17px;height:17px;flex:none; }
    .range-row { display:flex;gap:18px;align-items:center; }
    .range-row input[type=range] { width:100%;accent-color:var(--mint); }
    .range-val { min-width:50px;font-size:1rem;font-weight:800;text-align:right; }
    textarea { width:100%;resize:vertical;min-height:104px;background:#1b3041;border:1px solid #486073;border-radius:11px;color:var(--text);padding:12px 13px;font-size:.87rem; }
    textarea::placeholder { color:#819aab; }
    .actions { display:flex;flex-wrap:wrap;gap:10px;align-items:center; }
    .save-msg { color:var(--mint);font-size:.82rem;min-height:21px; }
    .chart-row { display:flex;align-items:center;gap:12px;margin:14px 0; }
    .bar-label { flex:0 0 95px;color:#c3d3de;font-size:.8rem; }
    .bar-track { background:#263a49;height:16px;border-radius:50px;flex:1;overflow:hidden; }
    .bar-fill { height:100%;background:#74d3b0;border-radius:50px;min-width:0; }
    .bar-value { flex:0 0 45px;text-align:right;font-size:.82rem;color:#d4e1e9; }
    .no-data { color:var(--muted);font-size:.86rem;padding:12px 0; }
    .file-input { display:none; }
    .privacy-note { font-size:.85rem;color:var(--muted); }
    .small-metrics { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:19px; }
    .footer { color:#7e99ac;font-size:.73rem;text-align:center;margin:25px 0; }
    .nav { position:fixed;z-index:10;left:0;right:0;bottom:0;background:#101e2cf5;border-top:1px solid #355064;box-shadow:0 -8px 28px #0003;backdrop-filter:blur(14px);padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;justify-content:center;gap:5px; }
    .nav-inner { display:flex;width:min(100%,650px);gap:5px; }
    .nav-btn { border:0;background:none;color:#91aabd;flex:1;min-width:0;border-radius:11px;padding:9px 3px 8px;font-size:.69rem;font-weight:750;display:flex;align-items:center;flex-direction:column;gap:4px; }
    .nav-btn svg { width:20px;height:20px;stroke-width:1.8; }
    .nav-btn.active { color:var(--mint);background:#214139; }
    .toast { position:fixed;z-index:30;bottom:98px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;width:max-content;max-width:calc(100vw - 30px);text-align:center;background:#e8faee;color:#144a37;font-weight:650;border-radius:11px;padding:13px 18px;box-shadow:0 18px 45px #0007;transition:opacity .2s,transform .2s;font-size:.84rem; }
    .toast.show { opacity:1;transform:translate(-50%,0); }
    .muted { color:var(--muted); }
    .date-heading { color:var(--mint);font-size:.8rem;font-weight:700;margin-bottom:5px;text-transform:capitalize; }
    @media(max-width:580px) {
      .wrap { padding:18px 13px 107px; }
      .brand { margin-bottom:15px; }
      .privacy { font-size:.66rem;padding:6px 8px; }
      .hero { padding:23px 19px;border-radius:18px; }
      .hero p:last-of-type { font-size:.88rem; }
      .cards { gap:7px; }
      .stat { padding:12px 11px;border-radius:13px; }
      .stat-label { font-size:.68rem; }
      .stat-val { font-size:1.55rem; }
      .stat-detail { font-size:.63rem; }
      .panel { padding:17px 13px;border-radius:15px; }
      .month-nav { gap:4px; }
      .month-name { min-width:106px;font-size:.83rem; }
      .icon-btn { min-width:32px;min-height:32px; }
      .calendar,.weekdays { gap:4px; }
      .day { min-height:48px;border-radius:9px; }
      .day .number { font-size:.83rem; }
      .status-group { gap:6px; }
      .option { min-height:69px;font-size:.72rem; }
      .legend { gap:10px; }
    }
    @media(max-width:365px) { .month-name { min-width:90px;font-size:.75rem; } .day { min-height:43px; } .privacy { display:none; } }

    /* v1.1 — Ferramentas e novos indicadores */
    .pill-note { display:inline-block;background:#223e48;color:#d9f8e9;border:1px solid #386359;border-radius:20px;padding:5px 9px;font-size:.75rem; }
    .activity { padding:14px 16px;background:#162c39;border:1px solid #2e5263;border-radius:13px;margin:11px 0; }
    .activity h3 { font-size:.96rem;margin:0 0 7px; }
    .activity p { font-size:.88rem;color:#d2e0ea;margin:0 0 9px; }
    .timeline { display:flex;align-items:end;gap:3px;overflow-x:auto;min-height:134px;padding:9px 1px 20px; }
    .timeline-day { min-width:22px;flex:1;max-width:45px;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:end; }
    .timeline-bar { width:75%;max-width:25px;min-height:3px;border-radius:7px 7px 2px 2px;background:#42576a; }
    .timeline-bar.done {background:var(--mint);} .timeline-bar.slip {background:var(--coral);} .timeline-bar.partial {background:#c5b2ff;}
    .timeline-label { font-size:.64rem;color:#c4d5e0; }
    .notice {padding:12px 14px;background:#1b2d3d;border-left:3px solid #92b5cc;border-radius:7px;color:#d8e6f0;font-size:.83rem;}
    .tool-time {font-size:2.6rem;font-variant-numeric:tabular-nums;font-weight:750;letter-spacing:-.05em;margin:9px 0;}
    .tool-steps {padding-left:20px;line-height:1.65;color:#dae7ee;font-size:.9rem;}
    .safe-space {color:#9de6cb;font-size:.82rem;}
    @media(max-width:430px){ .nav-btn {font-size:.62rem;} .nav-inner {gap:3px;} }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="brand">
      <div class="brand-main">
        <div class="symbol" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/><path d="M6 5l2-2M17 20l2-2" opacity=".65"/></svg>
        </div>
        <div><div class="brand-name">Rumo</div><div class="brand-sub">Seu diário de progresso</div></div>
      </div>
      <div class="privacy">Privado neste aparelho</div>
    </header>
    <main id="view" aria-live="polite"></main>
    <footer class="footer">Um registro não define você. Avançar também é aprender.</footer>
  </div>
  <nav class="nav" aria-label="Navegação principal">
    <div class="nav-inner">
      <button class="nav-btn active" type="button" data-tab="calendar" aria-label="Calendário"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Calendário</button>
      <button class="nav-btn" type="button" data-tab="checkin" aria-label="Registro"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h10a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2z"/><path d="M9 3h6v4H9zM8 12h8M8 16h5"/></svg>Registro</button>
      <button class="nav-btn" type="button" data-tab="stats" aria-label="Evolução"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M7 16V9M12 16V4M17 16v-6"/></svg>Evolução</button>
      <button class="nav-btn" type="button" data-tab="tools" aria-label="Ferramentas"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l-8 4v5c0 5 3.4 8.3 8 10 4.6-1.7 8-5 8-10V7z"/><path d="M8 12l3 3 5-6"/></svg>Ajuda rápida</button>
      <button class="nav-btn" type="button" data-tab="settings" aria-label="Dados"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2" fill="#101e2c"/><circle cx="16" cy="12" r="2" fill="#101e2c"/><circle cx="11" cy="17" r="2" fill="#101e2c"/></svg>Dados</button>
    </div>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      'use strict';
      const STORAGE_KEY = 'rumo_diario_v1';
      const habits = [
        ['noPhone', 'Deixei o celular fora do banheiro'],
        ['plan', 'Planejei uma atividade para quando estivesse sozinho'],
        ['alternative', 'Usei uma alternativa saudável quando senti vontade'],
        ['kindness', 'Registrei meus gatilhos sem me punir']
      ];
      const triggers = ['Sozinho com celular','Banheiro','Tédio','Ansiedade','Redes sociais','Cansaço','Outro'];
      const today = () => { const d = new Date(); return fmtDate(d); };
      const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const parseDate = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y,m-1,d,12); };
      const moveDate = (iso,days) => { const d=parseDate(iso); d.setDate(d.getDate()+days); return fmtDate(d); };
      const isISO = s => typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmtDate(parseDate(s))===s;
      const displayDate = (iso,opts={day:'numeric',month:'long',year:'numeric'}) => parseDate(iso).toLocaleDateString('pt-BR',opts);
      const monthName = d => d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
      const escapeHTML = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const sanitizeEntry = raw => ({
        status: ['done','slip'].includes(raw?.status)?raw.status:null,
        urge: Number.isInteger(raw?.urge) && raw.urge>=0 && raw.urge<=10?raw.urge:null,
        triggers: Array.isArray(raw?.triggers)?raw.triggers.filter(x=>triggers.includes(x)):[],
        habits: Object.fromEntries(habits.map(([key])=>[key,!!raw?.habits?.[key]])),
        bathroom: ['none','stopped','difficult'].includes(raw?.bathroom)?raw.bathroom:null,
        distress: Number.isInteger(raw?.distress)&&raw.distress>=0&&raw.distress<=10?raw.distress:null,
        interrupt: ['yes','no','notneeded'].includes(raw?.interrupt)?raw.interrupt:null,
        coping: ['helped','tried','nottried'].includes(raw?.coping)?raw.coping:null,
        note: typeof raw?.note==='string'?raw.note.slice(0,4000):'',
        updatedAt: typeof raw?.updatedAt==='string'?raw.updatedAt:''
      });
      function load() {
        try {
          const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return {};
          const parsed=JSON.parse(raw);if(typeof parsed!=='object'||!parsed||Array.isArray(parsed))return {};
          const result={};
          for(const [date,entry] of Object.entries(parsed)) if(isISO(date)&&entry&&typeof entry==='object')result[date]=sanitizeEntry(entry);
          return result;
        }catch(e){ return {}; }
      }
      const app={ view:'calendar',month:new Date(new Date().getFullYear(),new Date().getMonth(),1),selected:today(),entries:load() };
      const blankEntry = () => ({status:null,urge:null,triggers:[],habits:Object.fromEntries(habits.map(([k])=>[k,false])),bathroom:null,distress:null,interrupt:null,coping:null,note:'',updatedAt:''});
      let toastTimer;
      function toast(message){
        const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');
        clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200);
      }
      function save(){ try { localStorage.setItem(STORAGE_KEY,JSON.stringify(app.entries));return true; }catch(err){toast('Não foi possível salvar. Faça uma cópia dos dados.');return false;} }
      const daysBetween = (from,to) => Math.round((parseDate(to)-parseDate(from))/86400000);
      function daysBack(n){const values=[];for(let i=n-1;i>=0;i--)values.push(moveDate(today(),-i));return values;}

      function exportJSON(){if(!confirm('Backup sem criptografia: seus registros poderão ser lidos por quem tiver este arquivo. Deseja continuar?'))return;const payload={app:'Rumo',version:2,exportedAt:new Date().toISOString(),entries:app.entries};downloadBlob('rumo-backup-'+today()+'.json',new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}));toast(window.RumoAndroid?'Escolha onde salvar o backup.':'Cópia de segurança criada.');}
      function exportCSV(){
        if(!confirm('O CSV contém informações íntimas sem criptografia. Deseja continuar?'))return;
        const headers=['Data','Status','Vontade máxima','Gatilhos','Banheiro','Sofrimento','Interrompi impulso','Estratégias',...habits.map(([,label])=>label),'Observações'];
        const rows=Object.entries(app.entries).sort(([a],[b])=>a.localeCompare(b)).map(([date,e])=>[date,e.status==='done'?'Sem consumo':e.status==='slip'?'Houve consumo':'Não avaliado',e.urge??'',e.triggers.join('; '),e.bathroom||'',e.distress??'',e.interrupt||'',e.coping||'',...habits.map(([key])=>e.habits[key]?'Sim':'Não'),e.note]);
        const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
        const csv='\ufeff'+[headers,...rows].map(row=>row.map(q).join(',')).join('\r\n');
        downloadBlob('rumo-registros-'+today()+'.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}));toast(window.RumoAndroid?'Escolha onde salvar o CSV.':'CSV exportado.');
      }
      const bytesTo64=bytes=>btoa(String.fromCharCode(...bytes));
      const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
      async function keyFromPassword(password,salt){
        const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
        return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
      }
      async function exportSecure(){
        if(!crypto?.subtle){toast('Criptografia indisponível neste aparelho.');return;}
        const password=prompt('Crie uma senha forte (mínimo 10 caracteres) para proteger este backup:');
        if(password===null)return;
        if(password.length<10){toast('Escolha pelo menos 10 caracteres.');return;}
        const again=prompt('Repita a senha do backup:');
        if(again!==password){toast('As senhas não conferem.');return;}
        try{
          const salt=crypto.getRandomValues(new Uint8Array(16));
          const iv=crypto.getRandomValues(new Uint8Array(12));
          const key=await keyFromPassword(password,salt);
          const payload={app:'Rumo',version:2,exportedAt:new Date().toISOString(),entries:app.entries};
          const cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(payload))));
          const safe={app:'Rumo',version:2,encrypted:true,kdf:'PBKDF2-SHA256',iterations:250000,algorithm:'AES-256-GCM',salt:bytesTo64(salt),iv:bytesTo64(iv),ciphertext:bytesTo64(cipher)};
          downloadBlob('rumo-backup-protegido-'+today()+'.json',new Blob([JSON.stringify(safe)],{type:'application/json;charset=utf-8'}));
          toast('Escolha onde guardar o backup protegido.');
        }catch(e){toast('Falha ao preparar o backup protegido.');}
      }
      async function decryptBackup(wrapper){
        if(wrapper?.version!==2||wrapper?.algorithm!=='AES-256-GCM'||wrapper?.iterations!==250000||wrapper?.kdf!=='PBKDF2-SHA256')throw Error('Formato de criptografia incompatível');
        const salt=from64(wrapper.salt||''),iv=from64(wrapper.iv||''),ciphertext=from64(wrapper.ciphertext||'');
        if(salt.length!==16||iv.length!==12||ciphertext.length<16)throw Error('Cópia inválida');
        const password=prompt('Senha para desbloquear esta cópia de segurança:');
        if(password===null)throw Error('Cancelado');
        const key=await keyFromPassword(password,salt);
        const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ciphertext);
        return JSON.parse(new TextDecoder().decode(clear));
      }
      async function importJSON(file){
        if(!file)return;
        try {
          if(file.size>4000000)throw new Error('Arquivo grande demais');
          let raw=JSON.parse(await file.text());
          if(raw?.encrypted===true)raw=await decryptBackup(raw);
          if(raw?.app!=='Rumo'||![1,2].includes(raw?.version)||!raw.entries||typeof raw.entries!=='object'||Array.isArray(raw.entries))throw new Error('Formato inválido');
          const clean={};for(const [date,e]of Object.entries(raw.entries)){if(!isISO(date)||date>today()||!e||typeof e!=='object')continue;clean[date]=sanitizeEntry(e);}
          const count=Object.keys(clean).length;
          if(!confirm(`Importar ${count} registro(s)? Dias que já existem neste aparelho serão substituídos pelos da cópia. Os demais serão preservados.`))return;
          const previous=app.entries;app.entries={...app.entries,...clean};
          if(!save()){app.entries=previous;return;}
          render();toast(`${count} registro(s) importado(s).`);
        }catch(e){toast('Não foi possível importar. Verifique a cópia JSON do Rumo.');}
      }
      document.addEventListener('submit',e=>{if(e.target.id==='checkin-form'){e.preventDefault();storeCheckin();}});
      document.addEventListener('input',e=>{if(e.target.id==='urge-input')document.getElementById('urge-output').textContent=e.target.value+'/10';
        if(e.target.id==='distress-input')document.getElementById('distress-output').textContent=e.target.value+'/10';});
      document.addEventListener('change',e=>{
        if(e.target.id==='urge-known'){
          const range=document.getElementById('urge-input');range.disabled=!e.target.checked;
          document.getElementById('urge-output').textContent=e.target.checked?range.value+'/10':'—';
        }
        if(e.target.id==='distress-known'){const range=document.getElementById('distress-input');range.disabled=!e.target.checked;document.getElementById('distress-output').textContent=e.target.checked?range.value+'/10':'—';}
        if(e.target.id==='import-input')importJSON(e.target.files?.[0]);
      });
      document.addEventListener('click',e=>{
        const tab=e.target.closest('[data-tab]');if(tab){goto(tab.dataset.tab);return;}
        const dateBtn=e.target.closest('[data-date]');if(dateBtn && !dateBtn.disabled){
          app.selected=dateBtn.dataset.date;app.month=new Date(parseDate(app.selected).getFullYear(),parseDate(app.selected).getMonth(),1);goto('checkin');return;
        }
        const el=e.target.closest('[data-action]');if(!el)return;
        switch(el.dataset.action){
          case 'today-checkin':app.selected=today();goto('checkin');break;
          case 'open-tools':goto('tools');break;
          case 'timer-start':{ if(timerHandle!==null)return;const btn=el;btn.disabled=true; timerHandle=setInterval(()=>{timerRemaining=Math.max(0,timerRemaining-1);const display=document.getElementById('tool-timer');if(display)display.textContent=String(Math.floor(timerRemaining/60)).padStart(2,'0')+':'+String(timerRemaining%60).padStart(2,'0');if(timerRemaining===0){stopTimer();toast('Dois minutos concluídos. Como está a vontade agora?');}},1000);break;}
          case 'timer-reset':stopTimer();timerRemaining=120;const t=document.getElementById('tool-timer');if(t)t.textContent='02:00';document.querySelector('[data-action=timer-start]').disabled=false;break;
          case 'prev-month':monthShift(-1);break;
          case 'next-month':monthShift(1);break;
          case 'copy-checkin':{
            const entry=readForm();if(!entry)return;
            copyText(summaryText(app.selected,entry));break;
          }
          case 'export-secure':exportSecure();break;
          case 'export-json':exportJSON();break;
          case 'export-csv':exportCSV();break;
          case 'import-json':document.getElementById('import-input')?.click();break;
          case 'delete-all':if(confirm('Tem certeza que quer apagar TODOS os registros deste aparelho? Faça um backup antes.'))if(confirm('Última confirmação: apagar definitivamente todos os registros?')){const before=app.entries;app.entries={};if(save()){render();toast('Os registros deste navegador foram apagados.');}else app.entries=before;}break;
        }
      });
      render();
      if(!window.RumoAndroid && 'serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
    })();
  </script>
