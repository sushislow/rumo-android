<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1521">
  <meta name="description" content="Diário pessoal e privado para acompanhar hábitos, gatilhos e seu progresso, um dia de cada vez.">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <title>Rumo — Diário de progresso</title>
  <style>
    :root { --bg:#0b1421;--panel:#111f2e;--panel-alt:#17283a;--border:#284054;--muted:#a1b3c4;--text:#eff8fb;--mint:#78e1bb;--mint-dark:#173f38;--coral:#ffaba1;--coral-dark:#4e2c32;--lavender:#c5b2ff;--lavender-dark:#312c50;--cream:#fff0ce;--shadow:0 16px 45px rgba(0,0,0,.16);}
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--text);background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid var(--lavender);outline-offset:3px; }
    button:disabled { cursor:not-allowed;opacity:.35; }
    .wrap { max-width:880px; margin:0 auto; padding:25px 20px 120px; }
    .brand { display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 23px; }
    .brand-main { display:flex;align-items:center;gap:12px; }
    .symbol { display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:13px;background:#0b1421;border:1px solid #78e1bb40;overflow:hidden; }
    .symbol img { display:block;width:42px;height:42px;object-fit:contain;transform:scale(1.35); }
    .brand-name { font-size:1.18rem;font-weight:800;letter-spacing:.3px;line-height:1; }
    .brand-sub { color:var(--muted);font-size:.75rem;margin-top:4px; }
    .privacy { font-size:.75rem;color:var(--mint);border:1px solid #336859;background:#14372f;border-radius:40px;padding:7px 10px;white-space:nowrap;display:flex;align-items:center;gap:5px; }
    .privacy:before { content:"";width:6px;height:6px;background:var(--mint);border-radius:50%; }
    .hero { position:relative;overflow:hidden;background:linear-gradient(115deg,#173c3a,#132d3d 65%,#1a2846);padding:29px 26px 27px;border:1px solid #315451;border-radius:23px;margin-bottom:18px; }
    .hero:after { content:"";position:absolute;right:-66px;top:-93px;border:1px solid #8ee4cf3d;border-radius:50%;width:230px;height:230px;box-shadow:0 0 0 32px #8ee4cf09,0 0 0 75px #8ee4cf07;pointer-events:none; }
    .eyebrow { color:var(--mint);font-size:.79rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px; }
    h1 { font-size:clamp(1.75rem,4vw,2.45rem);letter-spacing:-.036em;line-height:1.12;margin:0 0 12px;max-width:520px; }
    .hero p:last-of-type { margin:0;color:#c4dce0;font-size:.95rem;max-width:540px; }
    .hero .hero-actions { margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1; }
    .btn { display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;padding:11px 15px;border-radius:11px;font-weight:700;font-size:.88rem;min-height:43px;text-decoration:none;transition:background .15s, transform .15s,color .15s; }
    .btn:active { transform:translateY(1px); }
    .btn-primary { background:var(--mint);color:#10312d; }
    .btn-primary:hover { background:#98edcd; }
    .btn-secondary { background:#263c48;color:#f4faff;border-color:#385562; }
    .btn-secondary:hover { background:#345061; }
    .btn-ghost { background:transparent;color:var(--mint);border-color:#456a68; }
    .btn-ghost:hover { background:#1c3b39; }
    .btn-danger { background:var(--coral-dark);color:#ffc6c0;border-color:#a55b62; }
    .btn-small { font-size:.81rem;padding:8px 11px;min-height:36px; }
    .cards { display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:12px;margin:0 0 19px; }
    .stat { background:var(--panel);border:1px solid var(--border);padding:17px 19px;border-radius:16px;min-width:0; }
    .stat-label { color:var(--muted);font-size:.78rem;line-height:1.35; }
    .stat-val { font-size:1.85rem;letter-spacing:-.06em;font-weight:790;line-height:1.25;margin-top:4px; }
    .stat-detail { color:#b7c8d6;font-size:.72rem; }
    .panel { background:var(--panel);border:1px solid var(--border);border-radius:19px;padding:23px;margin-bottom:17px;box-shadow:var(--shadow); }
    .panel h2 { font-size:1.24rem;letter-spacing:-.025em;margin:0 0 5px; }
    .panel .description { font-size:.87rem;color:var(--muted);margin:0 0 20px; }
    .panel-head { display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px; }
    .panel-head h2 { margin:0; }
    .month-nav { display:flex;align-items:center;gap:10px; }
    .icon-btn { background:var(--panel-alt);border:1px solid var(--border);border-radius:10px;min-width:37px;min-height:37px;color:var(--text);font-size:1.25rem;line-height:1;display:grid;place-items:center; }
    .icon-btn:hover:not(:disabled) { background:#244057; }
    .month-name { min-width:140px;text-align:center;font-size:.99rem;font-weight:750;text-transform:capitalize; }
    .weekdays { display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-bottom:8px; }
    .weekdays div { text-align:center;color:var(--muted);font-size:.76rem;font-weight:650; }
    .calendar { display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px; }
    .day { position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:62px;flex-direction:column;gap:3px;border:1px solid #2a4053;color:var(--text);background:#182839;border-radius:11px; }
    .day .number { font-size:.94rem;font-weight:700; }
    .day .dot { width:6px;height:6px;border-radius:50%;background:transparent; }
    .day.outside { opacity:.32;background:transparent; }
    .day.done { background:var(--mint-dark);border-color:#346e5f; }
    .day.done .number { color:#a9f4d5; }
    .day.done .dot { background:var(--mint); }
    .day.slip { background:var(--coral-dark);border-color:#895057; }
    .day.slip .number { color:#ffd0cb; }
    .day.slip .dot { background:var(--coral); }
    .day.partial { background:var(--lavender-dark);border-color:#65558c; }
    .day.partial .dot { background:var(--lavender); }
    .day.today { outline:2px solid #a3bfd0;outline-offset:1px; }
    .day.selected { box-shadow:inset 0 0 0 2px var(--cream); }
    .day:not(.outside):hover:not(:disabled) { filter:brightness(1.16); }
    .legend { display:flex;flex-wrap:wrap;gap:15px;margin-top:17px;color:#b4c6d6;font-size:.8rem; }
    .legend-item { display:flex;align-items:center;gap:7px; }
    .swatch { width:12px;height:12px;border-radius:4px;background:#233a4d;border:1px solid #426074; }
    .swatch.done { background:var(--mint);border-color:var(--mint); }
    .swatch.slip { background:var(--coral);border-color:var(--coral); }
    .swatch.partial { background:var(--lavender);border-color:var(--lavender); }
    .soft-note { color:#b9cdd5;font-size:.86rem;margin:15px 0 0; }
    .hint { background:#1a303d;border-left:3px solid #74cfb9;border-radius:0 10px 10px 0;padding:13px 15px;color:#cadbdc;font-size:.85rem;margin-bottom:18px; }
    .section-title { font-size:1.48rem;line-height:1.2;letter-spacing:-.028em;margin:3px 0 8px; }
    .section-sub { font-size:.9rem;color:var(--muted);margin:0 0 18px; }
    .field { margin-bottom:22px; }
    .field-head { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px; }
    .field-title { font-size:.92rem;font-weight:700; }
    .field-sub { margin:4px 0 11px;font-size:.78rem;color:var(--muted); }
    .status-group { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px; }
    .option { display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #385268;background:#1b3041;min-height:64px;padding:10px 6px;border-radius:12px;color:#c6d7e3;font-size:.84rem;font-weight:700;cursor:pointer; }
    .option input { position:absolute;opacity:0;width:1px;height:1px; }
    .option:has(input:checked) { border-color:#a5e9d1;background:#1b413a;color:#baf7de;box-shadow:0 0 0 1px #64d0a6; }
    .option.slip:has(input:checked) { background:#4a2d34;border-color:#ffb2a9;color:#ffd9d5;box-shadow:0 0 0 1px #ff9a8f; }
    .option:has(input:focus-visible) { outline:3px solid var(--lavender);outline-offset:2px; }
    .chips { display:flex;flex-wrap:wrap;gap:8px; }
    .chip { position:relative;border:1px solid #385368;padding:9px 13px;border-radius:30px;color:#c0d3df;font-size:.81rem;background:#1b3041;cursor:pointer; }
    .chip input { position:absolute;opacity:0;width:1px;height:1px; }
    .chip:has(input:checked) { background:#24483f;color:#bdf1dd;border-color:#73d6b4; }
    .chip:has(input:focus-visible) { outline:3px solid var(--lavender);outline-offset:2px; }
    .checkline { display:flex;align-items:flex-start;gap:11px;font-size:.88rem;color:#deecf4;padding:10px 0;cursor:pointer; }
    .checkline input { margin-top:3px;accent-color:#6bdab3;width:17px;height:17px;flex:none; }
    .range-row { display:flex;gap:18px;align-items:center; }
    .range-row input[type=range] { width:100%;accent-color:var(--mint); }
    .range-val { min-width:50px;font-size:1rem;font-weight:800;text-align:right; }
    textarea { width:100%;resize:vertical;min-height:104px;background:#1b3041;border:1px solid #486073;border-radius:11px;color:var(--text);padding:12px 13px;font-size:.87rem; }
    textarea::placeholder { color:#819aab; }
    .actions { display:flex;flex-wrap:wrap;gap:10px;align-items:center; }
    .save-msg { color:var(--mint);font-size:.82rem;min-height:21px; }
    .chart-row { display:flex;align-items:center;gap:12px;margin:14px 0; }
    .bar-label { flex:0 0 95px;color:#c3d3de;font-size:.8rem; }
    .bar-track { background:#263a49;height:16px;border-radius:50px;flex:1;overflow:hidden; }
    .bar-fill { height:100%;background:#74d3b0;border-radius:50px;min-width:0; }
    .bar-value { flex:0 0 45px;text-align:right;font-size:.82rem;color:#d4e1e9; }
    .no-data { color:var(--muted);font-size:.86rem;padding:12px 0; }
    .file-input { display:none; }
    .privacy-note { font-size:.85rem;color:var(--muted); }
    .small-metrics { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:19px; }
    .footer { color:#7e99ac;font-size:.73rem;text-align:center;margin:25px 0; }
    .nav { position:fixed;z-index:10;left:0;right:0;bottom:0;background:#101e2cf5;border-top:1px solid #355064;box-shadow:0 -8px 28px #0003;backdrop-filter:blur(14px);padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;justify-content:center;gap:5px; }
    .nav-inner { display:flex;width:min(100%,650px);gap:5px; }
    .nav-btn { border:0;background:none;color:#91aabd;flex:1;min-width:0;border-radius:11px;padding:9px 3px 8px;font-size:.69rem;font-weight:750;display:flex;align-items:center;flex-direction:column;gap:4px; }
    .nav-btn svg { width:20px;height:20px;stroke-width:1.8; }
    .nav-btn.active { color:var(--mint);background:#214139; }
    .toast { position:fixed;z-index:30;bottom:98px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;width:max-content;max-width:calc(100vw - 30px);text-align:center;background:#e8faee;color:#144a37;font-weight:650;border-radius:11px;padding:13px 18px;box-shadow:0 18px 45px #0007;transition:opacity .2s,transform .2s;font-size:.84rem; }
    .toast.show { opacity:1;transform:translate(-50%,0); }
    .muted { color:var(--muted); }
    .date-heading { color:var(--mint);font-size:.8rem;font-weight:700;margin-bottom:5px;text-transform:capitalize; }
    @media(max-width:580px) {
      .wrap { padding:18px 13px 107px; }
      .brand { margin-bottom:15px; }
      .privacy { font-size:.66rem;padding:6px 8px; }
      .hero { padding:23px 19px;border-radius:18px; }
      .hero p:last-of-type { font-size:.88rem; }
      .cards { gap:7px; }
      .stat { padding:12px 11px;border-radius:13px; }
      .stat-label { font-size:.68rem; }
      .stat-val { font-size:1.55rem; }
      .stat-detail { font-size:.63rem; }
      .panel { padding:17px 13px;border-radius:15px; }
      .month-nav { gap:4px; }
      .month-name { min-width:106px;font-size:.83rem; }
      .icon-btn { min-width:32px;min-height:32px; }
      .calendar,.weekdays { gap:4px; }
      .day { min-height:48px;border-radius:9px; }
      .day .number { font-size:.83rem; }
      .status-group { gap:6px; }
      .option { min-height:69px;font-size:.72rem; }
      .legend { gap:10px; }
    }
    @media(max-width:365px) { .month-name { min-width:90px;font-size:.75rem; } .day { min-height:43px; } .privacy { display:none; } }

    /* v1.1 — Ferramentas e novos indicadores */
    .pill-note { display:inline-block;background:#223e48;color:#d9f8e9;border:1px solid #386359;border-radius:20px;padding:5px 9px;font-size:.75rem; }
    .activity { padding:14px 16px;background:#162c39;border:1px solid #2e5263;border-radius:13px;margin:11px 0; }
    .activity h3 { font-size:.96rem;margin:0 0 7px; }
    .activity p { font-size:.88rem;color:#d2e0ea;margin:0 0 9px; }
    .timeline { display:flex;align-items:end;gap:3px;overflow-x:auto;min-height:134px;padding:9px 1px 20px; }
    .timeline-day { min-width:22px;flex:1;max-width:45px;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:end; }
    .timeline-bar { width:75%;max-width:25px;min-height:3px;border-radius:7px 7px 2px 2px;background:#42576a; }
    .timeline-bar.done {background:var(--mint);} .timeline-bar.slip {background:var(--coral);} .timeline-bar.partial {background:#c5b2ff;}
    .timeline-label { font-size:.64rem;color:#c4d5e0; }
    .notice {padding:12px 14px;background:#1b2d3d;border-left:3px solid #92b5cc;border-radius:7px;color:#d8e6f0;font-size:.83rem;}
    .tool-time {font-size:2.6rem;font-variant-numeric:tabular-nums;font-weight:750;letter-spacing:-.05em;margin:9px 0;}
    .tool-steps {padding-left:20px;line-height:1.65;color:#dae7ee;font-size:.9rem;}
    .safe-space {color:#9de6cb;font-size:.82rem;}
    @media(max-width:430px){ .nav-btn {font-size:.62rem;} .nav-inner {gap:3px;} }

    /* v1.2: temas e mensagens -- paletas controladas, status continua semanticamente consistente. */
    :root[data-theme="violeta"] {--bg:#171326;--panel:#211c33;--panel-alt:#302846;--border:#514363;--muted:#c0b5d4;--text:#faf5ff;--mint:#d8b4fe;--mint-dark:#3e2856;--coral:#ffc0a9;--coral-dark:#54333e;--lavender:#bee4ff;--lavender-dark:#293b57;--cream:#f7e9c9;}
    :root[data-theme="floresta"] {--bg:#0b201c;--panel:#133029;--panel-alt:#1d4137;--border:#366052;--muted:#b2d0c5;--text:#f1fff8;--mint:#9af0a9;--mint-dark:#1e523a;--coral:#ffb1a6;--coral-dark:#543337;--lavender:#e0c5ff;--lavender-dark:#473456;--cream:#fff3cd;}
    :root[data-theme="areia"] {--bg:#f8f5ec;--panel:#fffdfa;--panel-alt:#eae3d5;--border:#b5ab97;--muted:#5c554a;--text:#252920;--mint:#14694c;--mint-dark:#d1e9da;--coral:#823c3c;--coral-dark:#f6dddc;--lavender:#523996;--lavender-dark:#e8e1f6;--cream:#4c3a18;--shadow:0 10px 25px #352a2119;}
    /* Usa as variáveis em superfícies que antes tinham tons fixos. */
    .panel,.stat {color:var(--text)}
    .day {background:var(--panel-alt);border-color:var(--border)}
    .day.done {background:var(--mint-dark);border-color:var(--mint)}
    .day.done .number,.day.done .dot {color:var(--mint)}
    .day.slip {background:var(--coral-dark);border-color:var(--coral)}
    .day.slip .number {color:var(--coral)}
    .day.partial {background:var(--lavender-dark);border-color:var(--lavender)}
    .day.selected {box-shadow:inset 0 0 0 2px var(--cream)}
    .option,.chip,textarea,.activity,.notice {background:var(--panel-alt);border-color:var(--border);color:var(--text)}
    .option:has(input:checked),.chip:has(input:checked) {background:var(--mint-dark);border-color:var(--mint);color:var(--mint)}
    .option.slip:has(input:checked) {background:var(--coral-dark);border-color:var(--coral);color:var(--coral)}
    .stat-detail,.soft-note,.field-sub,.legend,.checkline,.activity p,.notice,.privacy-note,.activity h3,.timeline-label,.bar-label,.bar-value {color:var(--muted)}
    .swatch {background:var(--panel-alt);border-color:var(--border)}
    .bar-track {background:var(--panel-alt)}
    .bar-fill {background:var(--mint)}
    .icon-btn,.btn-secondary {background:var(--panel-alt);border-color:var(--border);color:var(--text)}
    .nav {background:var(--panel);border-color:var(--border)}
    .nav-btn {color:var(--muted)}
    .nav-btn.active {color:var(--mint);background:var(--mint-dark)}
    .btn-primary {background:var(--mint);color:#092c23}
    :root[data-theme="areia"] .btn-primary {color:#fff}
    .btn-ghost {color:var(--mint);border-color:var(--mint)}
    .btn-danger {color:var(--coral);background:var(--coral-dark);border-color:var(--coral)}
    :root[data-theme="areia"] .hero {background:linear-gradient(120deg,#d3e9dc,#efe6ce);border-color:#aec5b1;color:#202c25}
    :root[data-theme="areia"] .hero p:last-of-type {color:#3d5349}
    :root[data-theme="areia"] .privacy {background:#d9eddd;border-color:#b5d9c2;color:#14694c}
    :root[data-theme="areia"] .privacy:before {background:#14694c}
    :root[data-theme="areia"] .eyebrow {color:#14694c}
    :root[data-theme="areia"] .option,.chip,:root[data-theme="areia"] textarea {color:var(--text)}
    :root[data-theme="areia"] .option:has(input:checked),:root[data-theme="areia"] .chip:has(input:checked) {color:#124e38}
    :root[data-theme="areia"] .option.slip:has(input:checked) {color:#823c3c}
    :root[data-theme="areia"] .day.done .number {color:#0a5135}
    :root[data-theme="areia"] .day.slip .number {color:#823c3c}
    :root[data-theme="areia"] .legend,.soft-note,.field-sub,.checkline {color:#5c554a}
    .day .dot {width:auto;height:14px;min-width:12px;background:transparent!important;font-size:.71rem;font-weight:900;line-height:1}
    .day.done .dot {color:var(--mint)}
    .day.slip .dot {color:var(--coral)}
    .day.partial .dot {color:var(--lavender)}
    .theme-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
    .theme-choice {min-height:78px;border:2px solid var(--border);border-radius:13px;background:var(--panel-alt);color:var(--text);padding:12px;text-align:left;font-weight:730;display:flex;align-items:center;gap:11px}
    .theme-choice[aria-pressed="true"] {border-color:var(--mint);outline:2px solid var(--mint);outline-offset:1px}
    .theme-preview {width:28px;height:35px;border-radius:8px;flex:none;border:2px solid #8a9296;}
    .pref-field {display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
    .pref-field:last-child {border-bottom:0}
    .pref-field label {font-weight:650;font-size:.88rem}
    .pref-field select,.pref-field input[type=time] {background:var(--panel-alt);border:1px solid var(--border);border-radius:9px;padding:10px;color:var(--text);font:inherit;max-width:160px;min-width:104px}
    .pref-field select:focus-visible,.pref-field input[type=time]:focus-visible {outline:3px solid var(--lavender)}
    .feedback {border:1px solid var(--border);background:var(--panel-alt);padding:16px;border-radius:14px;margin:18px 0;line-height:1.6}
    .feedback strong {display:block;font-size:1rem;margin-bottom:5px}
    .feedback.done {border-left:4px solid var(--mint)}
    .feedback.slip {border-left:4px solid var(--coral)}
    .feedback.partial {border-left:4px solid var(--lavender)}
    .feedback p {margin:0;color:var(--text);font-size:.9rem}
    @media (prefers-reduced-motion:reduce) {*,*:before,*:after {scroll-behavior:auto!important;transition:none!important;animation:none!important}}
    .new-input {width:100%;min-width:0;padding:12px;border:1px solid var(--border);border-radius:11px;background:var(--panel-alt);color:var(--text)}
    .new-row {display:flex;gap:8px;align-items:center;margin-top:12px}.new-row .new-input{flex:1}.new-row .btn{flex:none}
    .progress-card {margin:18px 0;padding:20px;border:1px solid var(--border);border-radius:18px;background:var(--panel)}
    .progress-number {font-size:2rem;color:var(--mint);font-weight:800;line-height:1.1;margin:10px 0}
    .badge-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:16px}
    .badge {padding:15px;border:1px solid var(--border);border-radius:13px;background:var(--panel-alt)}
    .badge.earned{border-color:var(--mint)}.badge strong{display:block;margin-bottom:6px}.badge p{font-size:.8rem;color:var(--muted);margin:5px 0}
    .badge progress {width:100%;height:8px;accent-color:var(--mint)}
    .feature-details summary {font-size:1.1rem;font-weight:750;cursor:pointer;min-height:40px;padding:5px 0}
    .feature-details[open] summary {margin-bottom:14px}.feature-note {font-size:.85rem;color:var(--muted);line-height:1.55}
    .saved-plan {border-left:4px solid var(--mint)}.saved-plan p{overflow-wrap:anywhere}.privacy-tip {margin:12px 0;padding:13px;border-radius:11px;background:var(--mint-dark);color:var(--text)}
    .trigger-list {display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.trigger-list button{overflow-wrap:anywhere;max-width:100%}
    .option.is-selected,.chip.is-selected{border-color:var(--mint);background:var(--mint-dark);color:var(--text);box-shadow:0 0 0 1px var(--mint)}
    .option.slip.is-selected{border-color:var(--coral);background:var(--coral-dark);color:var(--text);box-shadow:0 0 0 1px var(--coral)}
    :root[data-theme="areia"] .option.is-selected,:root[data-theme="areia"] .chip.is-selected{color:#124e38}
    :root[data-theme="areia"] .option.slip.is-selected{color:#823c3c}
    .option:focus-within,.chip:focus-within{outline:3px solid var(--lavender);outline-offset:2px}
    @media(max-width:480px){.badge-grid{grid-template-columns:1fr}.new-row{flex-wrap:wrap}.new-row .new-input{flex-basis:100%}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="brand">
      <div class="brand-main">
        <div class="symbol" aria-hidden="true">
          <img src="./icons/icon-192.png" width="42" height="42" alt="" decoding="async">
        </div>
        <div><div class="brand-name">Rumo</div><div class="brand-sub">Seu diário de progresso</div></div>
      </div>
      <div class="privacy">Privado neste aparelho</div>
    </header>
    <main id="view" aria-live="polite"></main>
    <footer class="footer">Um registro não define você. Avançar também é aprender.</footer>
  </div>
  <nav class="nav" aria-label="Navegação principal">
    <div class="nav-inner">
      <button class="nav-btn active" type="button" data-tab="calendar" aria-label="Calendário"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Calendário</button>
      <button class="nav-btn" type="button" data-tab="checkin" aria-label="Registro"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h10a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2z"/><path d="M9 3h6v4H9zM8 12h8M8 16h5"/></svg>Registro</button>
      <button class="nav-btn" type="button" data-tab="stats" aria-label="Evolução"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M7 16V9M12 16V4M17 16v-6"/></svg>Evolução</button>
      <button class="nav-btn" type="button" data-tab="tools" aria-label="Ferramentas"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l-8 4v5c0 5 3.4 8.3 8 10 4.6-1.7 8-5 8-10V7z"/><path d="M8 12l3 3 5-6"/></svg>Ajuda rápida</button>
      <button class="nav-btn" type="button" data-tab="settings" aria-label="Dados"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2" fill="#101e2c"/><circle cx="16" cy="12" r="2" fill="#101e2c"/><circle cx="11" cy="17" r="2" fill="#101e2c"/></svg>Dados</button>
    </div>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./features.js"></script>
  <script>
    (() => {
      'use strict';
      try {
      const F=globalThis.RumoFeatures;
      if(!F)throw Error('Recursos do aplicativo indisponíveis');
      const STORAGE_KEY = 'rumo_diario_v1';
      const secureNative=!!(window.RumoAndroid&&typeof window.RumoAndroid.getProtectedItem==='function'
        &&typeof window.RumoAndroid.setProtectedItem==='function'&&typeof window.RumoAndroid.migrateStorage==='function');
      const storage={
        getItem:key=>secureNative?window.RumoAndroid.getProtectedItem(key):localStorage.getItem(key),
        setItem:(key,value)=>{if(secureNative){if(!window.RumoAndroid.setProtectedItem(key,value))throw Error('Falha no cofre');}else localStorage.setItem(key,value);}
      };
      function persistBundle(values){
        if(secureNative){
          if(typeof window.RumoAndroid.setProtectedBundle!=='function'||!window.RumoAndroid.setProtectedBundle(JSON.stringify(values)))throw Error('Não foi possível gravar a atualização completa');
          return;
        }
        const before=Object.fromEntries(Object.keys(values).map(key=>[key,localStorage.getItem(key)]));
        try{for(const [key,value]of Object.entries(values))localStorage.setItem(key,value);}
        catch(error){for(const [key,value]of Object.entries(before)){try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value);}catch(ignored){}}throw error;}
      }
      if(secureNative){
        const legacy={};
        for(const key of [STORAGE_KEY,'rumo_preferencias_v1','rumo_conquistas_v1']){
          const raw=localStorage.getItem(key);if(raw!==null)legacy[key]=raw;
        }
        if(Object.keys(legacy).length){
          if(!window.RumoAndroid.migrateStorage(JSON.stringify(legacy)))throw Error('A migração não foi confirmada. A cópia anterior foi preservada.');
          for(const key of Object.keys(legacy)){
            if(storage.getItem(key)===null)throw Error('Não foi possível confirmar os registros protegidos');
            localStorage.removeItem(key);
          }
        }
      }
      const habits = [
        ['noPhone', 'Deixei o celular fora do banheiro'],
        ['plan', 'Planejei uma atividade para quando estivesse sozinho'],
        ['alternative', 'Usei uma alternativa saudável quando senti vontade'],
        ['kindness', 'Registrei meus gatilhos sem me punir']
      ];
      const triggers = ['Sozinho com celular','Banheiro','Tédio','Ansiedade','Redes sociais','Cansaço','Outro'];

      const PREFS_KEY='rumo_preferencias_v1';
      const themes=['oceano','violeta','floresta','areia'];
      const defaults={theme:'oceano',reminderCount:0,reminderTimes:['08:30','14:00','20:30']};
      function safeTime(value,fallback){return typeof value==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(value)?value:fallback;}
      function loadPrefs(){
        try{const p=JSON.parse(storage.getItem(PREFS_KEY)||'{}');return {
          theme:themes.includes(p.theme)?p.theme:defaults.theme,
          reminderCount:Number.isInteger(p.reminderCount)&&p.reminderCount>=0&&p.reminderCount<=3?p.reminderCount:0,
          reminderTimes:defaults.reminderTimes.map((d,i)=>safeTime(p.reminderTimes?.[i],d)),
          customTriggers:F.labels(p.customTriggers,30),planTrigger:F.text(p.planTrigger,120),planAction:F.text(p.planAction,300),
          quickMode:p.quickMode===true,showAchievements:p.showAchievements!==false,showCounter:p.showCounter!==false,
          widgetEnabled:p.widgetEnabled===true,widgetMode:['total','registered','sequence'].includes(p.widgetMode)?p.widgetMode:'total'
        };}catch(e){return {...defaults,reminderTimes:[...defaults.reminderTimes]};}
      }
      let prefs=loadPrefs();
      function applyTheme(){document.documentElement.setAttribute('data-theme',prefs.theme);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',prefs.theme==='areia'?'#f8f5ec':'#0b1421');}
      function savePrefs(){try{storage.setItem(PREFS_KEY,JSON.stringify(prefs));return true;}catch(error){toast('Não foi possível salvar as preferências.');return false;}}
      function setPrefs(changes){const before=prefs;prefs={...prefs,...changes};if(!savePrefs()){prefs=before;return false;}return true;}
      function appInfo(){try{return typeof window.RumoAndroid?.getAppInfo==='function'?JSON.parse(window.RumoAndroid.getAppInfo()):{version:'1.3.0',encryptedStorage:false,supportEmail:''};}catch(error){return {version:'1.3.0',encryptedStorage:false,supportEmail:''};}}
      function triggerOptions(entry){return F.labels([...triggers,...(prefs.customTriggers||[]),...(entry?.triggers||[])],60);}
      applyTheme();
      const congratulations=[
        'Você fez uma escolha alinhada ao seu objetivo hoje. Reconheça o esforço e mantenha sua rotina.',
        'Hoje houve um avanço. Não precisa ser perfeito amanhã: apenas continue praticando suas estratégias.',
        'Seu registro mostra uma decisão consciente. Observe o que ajudou e repita o que funcionou.',
        'Você cuidou de um objetivo importante. Celebre o passo e siga um dia de cada vez.',
        'Você conseguiu praticar uma escolha importante. O próximo passo é cuidar da rotina que a tornou possível.',
        'A consistência é construída aos poucos. Identifique uma pequena atitude que quer repetir amanhã.',
        'Reconheça o que deu certo, sem criar a obrigação de ter um dia perfeito amanhã.',
        'Hoje você registrou um dia alinhado ao seu plano. Mantenha as estratégias que funcionaram.',
        'Um dia registrado com sinceridade é informação para continuar. Parabéns pelo compromisso com seu plano.',
        'Hoje você teve espaço para escolher sua resposta. Continue praticando essa habilidade.',
        'Você está construindo um hábito novo com ações reais. Valorize a atitude, não apenas o número no calendário.',
        'Seu esforço merece ser reconhecido. Cuide também do descanso e das relações fora da tela.'
      ];
      const lapseSupport=[
        'Hoje houve consumo. Interromper o ciclo e entender o contexto ainda é possível. Qual gatilho apareceu primeiro?',
        'Um dia difícil não apaga os anteriores. Anote o que antecedeu o consumo e escolha uma proteção para amanhã.',
        'Evite transformar este registro em autocrítica. Retome o plano com uma mudança prática e alcançável.',
        'O registro foi sincero. O próximo passo é aprender com o ocorrido, não se punir por ele.',
        'Você pode retomar seu plano agora. Qual ambiente ou aplicativo precisa de uma barreira adicional?',
        'Um deslize é informação, não uma identidade. Perceba o contexto e escolha uma resposta diferente para a próxima vez.',
        'O importante agora é interromper o comportamento e cuidar de você. Não existe benefício em se castigar.',
        'Se o impulso apareceu num momento de cansaço, pense em uma rotina de descanso mais protegida.',
        'O que aconteceu pode ser estudado sem julgamento. Que sinal inicial você quer reconhecer da próxima vez?',
        'Não precisa compensar o que aconteceu. Um passo viável para hoje vale mais do que prometer mudanças impossíveis.',
        'Retome as estratégias que já ajudaram antes. Ajustar uma barreira é mais útil do que buscar perfeição.',
        'Seu objetivo continua válido. Você pode aprender com o dia e escolher uma ação pequena para recomeçar.'
      ];
      const partialSupport=['Registrar o que aconteceu já ajuda a identificar padrões. Você pode completar o resto quando quiser.'];
      function messageFor(date,status){
        const collection=status==='done'?congratulations:status==='slip'?lapseSupport:partialSupport;
        const idx=Array.from(date).reduce((acc,ch)=>acc+ch.charCodeAt(0),0)%collection.length;
        return {title:status==='done'?'Um passo reconhecido':status==='slip'?'Seu caminho continua':'Registro feito',body:collection[idx]};
      }
      function feedbackHTML(date,status){const m=messageFor(date,status);return `<div class="feedback ${status||'partial'}" role="status"><strong>${escapeHTML(m.title)}</strong><p>${escapeHTML(m.body)}</p></div>`;}
      // Acionado pelo Android após a autorização. Com permissão negada os lembretes permanecem desligados.
      window.RumoNativeNotificationsResult=(enabled,message)=>{
        if(!enabled){prefs.reminderCount=0;savePrefs();}
        if(app.view==='settings')render();
        toast(message|| (enabled?'Lembretes configurados.':'Lembretes desligados.'));
      };

      const today = () => { const d = new Date(); return fmtDate(d); };
      const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const parseDate = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y,m-1,d,12); };
      const moveDate = (iso,days) => { const d=parseDate(iso); d.setDate(d.getDate()+days); return fmtDate(d); };
      const isISO = s => typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmtDate(parseDate(s))===s;
      const displayDate = (iso,opts={day:'numeric',month:'long',year:'numeric'}) => parseDate(iso).toLocaleDateString('pt-BR',opts);
      const monthName = d => d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
      const escapeHTML = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const sanitizeEntry = raw => ({
        status: ['done','slip'].includes(raw?.status)?raw.status:null,
        urge: Number.isInteger(raw?.urge) && raw.urge>=0 && raw.urge<=10?raw.urge:null,
        triggers: F.labels(raw?.triggers,20),
        habits: Object.fromEntries(habits.map(([key])=>[key,!!raw?.habits?.[key]])),
        bathroom: ['none','stopped','difficult'].includes(raw?.bathroom)?raw.bathroom:null,
        distress: Number.isInteger(raw?.distress)&&raw.distress>=0&&raw.distress<=10?raw.distress:null,
        interrupt: ['yes','no','notneeded'].includes(raw?.interrupt)?raw.interrupt:null,
        coping: ['helped','tried','nottried'].includes(raw?.coping)?raw.coping:null,
        strategy:F.text(raw?.strategy,300),
        note: typeof raw?.note==='string'?raw.note.slice(0,4000):'',
        updatedAt: typeof raw?.updatedAt==='string'?raw.updatedAt:''
      });
      function load() {
          const raw=storage.getItem(STORAGE_KEY);if(!raw)return {};
          const parsed=JSON.parse(raw);if(typeof parsed!=='object'||!parsed||Array.isArray(parsed))throw Error('Formato do diário inválido; a cópia armazenada foi preservada.');
          const result={};
          for(const [date,entry] of Object.entries(parsed)) if(isISO(date)&&date<=today()&&entry&&typeof entry==='object')result[date]=sanitizeEntry(entry);
          return result;
      }
      const app={ view:'calendar',month:new Date(new Date().getFullYear(),new Date().getMonth(),1),selected:today(),entries:load() };
      const blankEntry = () => ({status:null,urge:null,triggers:[],habits:Object.fromEntries(habits.map(([k])=>[k,false])),bathroom:null,distress:null,interrupt:null,coping:null,strategy:'',note:'',updatedAt:''});
      let checkinDraft=null;
      const LEDGER_KEY='rumo_conquistas_v1';
      let ledger=F.cleanLedger(JSON.parse(storage.getItem(LEDGER_KEY)||'{}'),today());
      function updateProgress(){
        const stats=F.progress(app.entries,today()),next=F.award(ledger,stats,today());
        if(JSON.stringify(next)!==JSON.stringify(ledger)){try{storage.setItem(LEDGER_KEY,JSON.stringify(next));ledger=next;}catch(error){toast('Registro salvo; não foi possível atualizar as conquistas.');}}
        try{if(typeof window.RumoAndroid?.syncWidget==='function')return window.RumoAndroid.syncWidget(JSON.stringify(F.widget(stats,prefs)));}
        catch(error){return false;}return true;
      }
      window.RumoNativeSettingsChanged=()=>{if(app.view==='settings')render();};
      let toastTimer;
      function toast(message){
        const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');
        clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200);
      }
      function save(){ try { storage.setItem(STORAGE_KEY,JSON.stringify(app.entries));updateProgress();return true; }catch(err){toast('Não foi possível salvar. Faça uma cópia dos dados.');return false;} }
      const daysBetween = (from,to) => Math.round((parseDate(to)-parseDate(from))/86400000);
      function daysBack(n){const values=[];for(let i=n-1;i>=0;i--)values.push(moveDate(today(),-i));return values;}
      function summaryFor(range){const list=daysBack(range).map(d=>app.entries[d]).filter(e=>e?.status);return {registered:list.length,done:list.filter(e=>e.status==='done').length,slip:list.filter(e=>e.status==='slip').length};}
      function render(){
        document.querySelectorAll('[data-tab]').forEach(btn=>{const active=btn.dataset.tab===app.view;btn.classList.toggle('active',active);btn.setAttribute('aria-current',active?'page':'false');});
        document.getElementById('view').innerHTML=(app.view==='tools'?planHTML():'')+({calendar:calendarPage,checkin:checkinPage,stats:statsPage,tools:toolsPage,settings:settingsPage}[app.view])();
        syncChoices();
      }
      function syncChoices(){document.querySelectorAll('.chip,.option').forEach(label=>label.classList.toggle('is-selected',!!label.querySelector('input')?.checked));}
      function goto(view){if(app.view==='checkin'&&document.getElementById('checkin-form'))rememberDraft();stopTimer();timerRemaining=120;app.view=view;render();window.scrollTo({top:0,behavior:'smooth'});}
      function monthShift(direction){
        const newMonth = new Date(app.month.getFullYear(),app.month.getMonth()+direction,1);
        if(fmtDate(newMonth).slice(0,7)>today().slice(0,7))return;
        app.month=newMonth;render();
      }
      function calendarPage(){
        const sums=summaryFor(7),first=new Date(app.month.getFullYear(),app.month.getMonth(),1),offset=(first.getDay()+6)%7,lastDay=new Date(app.month.getFullYear(),app.month.getMonth()+1,0).getDate();
        const total=Math.ceil((offset+lastDay)/7)*7;
        let days='';
        for(let i=0;i<total;i++){
          const date=new Date(app.month.getFullYear(),app.month.getMonth(),i-offset+1);
          const iso=fmtDate(date),outside=date.getMonth()!==app.month.getMonth(),future=iso>today();
          const entry=app.entries[iso];const cls=entry?.status||(!outside&&entry?'partial':'');
          const statusLabel=cls==='done'?'sem consumo':cls==='slip'?'houve consumo':cls==='partial'?'registro parcial':'sem registro';
          days+=`<button type="button" class="day ${outside?'outside':''} ${cls} ${iso===today()?'today':''} ${iso===app.selected?'selected':''}" data-date="${iso}" aria-label="${displayDate(iso)}: ${statusLabel}" ${future?'disabled title="Data futura"':''}><span class="number">${date.getDate()}</span><span class="dot" aria-hidden="true">${cls==='done'?'✓':cls==='slip'?'↗':cls==='partial'?'·':''}</span></button>`;
        }
        const futureMonth = fmtDate(new Date(app.month.getFullYear(),app.month.getMonth()+1,1)).slice(0,7)>today().slice(0,7);
        return `<section class="hero"><p class="eyebrow">Um dia de cada vez</p><h1>Seu caminho é feito de pequenos passos.</h1><p>Registre como foi seu dia, reconheça seus gatilhos e acompanhe sua evolução sem julgamentos.</p><div class="hero-actions"><button type="button" class="btn btn-primary" data-action="today-checkin">+ Fazer check-in de hoje</button><button type="button" class="btn btn-secondary" data-action="open-tools">Preciso de ajuda agora</button></div></section>
          ${progressHTML()}<div class="cards" aria-label="Resumo dos últimos sete dias"><div class="stat"><div class="stat-label">Dias registrados</div><div class="stat-val">${sums.registered}</div><div class="stat-detail">Últimos 7 dias</div></div><div class="stat"><div class="stat-label">Sem consumo</div><div class="stat-val" style="color:var(--mint)">${sums.done}</div><div class="stat-detail">Dias marcados</div></div><div class="stat"><div class="stat-label">Com consumo</div><div class="stat-val" style="color:var(--coral)">${sums.slip}</div><div class="stat-detail">Dias marcados</div></div></div>
          <section class="panel"><div class="panel-head"><h2>Meu calendário</h2><div class="month-nav"><button class="icon-btn" data-action="prev-month" aria-label="Mês anterior">‹</button><span class="month-name">${escapeHTML(monthName(app.month))}</span><button class="icon-btn" data-action="next-month" aria-label="Próximo mês" ${futureMonth?'disabled':''}>›</button></div></div><div class="weekdays" aria-hidden="true">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div>${x}</div>`).join('')}</div><div class="calendar">${days}</div><div class="legend"><span class="legend-item"><span class="swatch done"></span>Sem pornografia</span><span class="legend-item"><span class="swatch slip"></span>Houve consumo</span><span class="legend-item"><span class="swatch partial"></span>Registro parcial</span><span class="legend-item"><span class="swatch"></span>Sem registro</span></div><p class="soft-note">Toque em qualquer dia passado ou em hoje para preencher ou editar o registro.</p></section>
          <div class="hint">Um dia difícil não apaga os anteriores. Nosso foco é perceber padrões e tornar suas escolhas mais livres.</div>`;
      }
      function checkinPage(){
        if(app.selected>today())app.selected=today();
        const e=checkinDraft?.date===app.selected?checkinDraft.entry:(app.entries[app.selected]||blankEntry());
        const statusOptions=[['done','✓ Sem pornografia'],['slip','↗ Houve consumo'],['none','Ainda não avaliei']];
        return `<p class="date-heading">${escapeHTML(displayDate(app.selected,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}</p><h1 class="section-title">Meu check-in</h1><p class="section-sub">O importante é registrar com sinceridade, sem se punir.</p><label class="checkline"><input type="checkbox" id="quick-mode" ${prefs.quickMode?'checked':''}> Modo rápido: mostrar primeiro o essencial</label>
          <section class="panel"><form id="checkin-form">
          <div class="field"><div class="field-title">Como foi em relação à pornografia?</div><p class="field-sub">Marque o que aconteceu neste dia. Os dias sem registro permanecem neutros.</p><div class="status-group">${statusOptions.map(([value,label])=>`<label class="option ${value==='slip'?'slip':''}"><input type="radio" name="status" value="${value}" ${((e.status||'none')===value)?'checked':''}><span>${label}</span></label>`).join('')}</div></div>

      let timerRemaining=120,timerHandle=null;
      const stopTimer=()=>{if(timerHandle!==null){clearInterval(timerHandle);timerHandle=null;}};
      function toolsPage(){
        return `<h1 class="section-title">Ajuda para os momentos difíceis</h1><p class="section-sub">Exercícios de autorregulação. Não são tratamento nem garantem que a vontade desapareça.</p>
        <section class="panel"><h2>Quando surgir um impulso</h2><p class="description">O objetivo é observar o impulso sem agir automaticamente.</p>

          <div class="activity"><h3>2. Observe por dois minutos</h3><p>Respire naturalmente. Perceba a intensidade no corpo sem brigar com a sensação.</p><div class="tool-time" id="tool-timer">02:00</div><div class="actions"><button class="btn btn-primary" data-action="timer-start">Iniciar 2 minutos</button><button class="btn btn-secondary" data-action="timer-reset">Reiniciar</button></div></div>
          <div class="activity"><h3>3. Escolha uma ação pequena</h3><p>Ande por alguns minutos, tome água, faça uma tarefa simples ou converse com alguém. Reavalie a vontade depois.</p></div>
          <p class="notice">Ter pensamentos ou desejo sexual não é uma recaída. O foco é decidir conscientemente como agir.</p></section>

          <ol class="tool-steps"><li>O que eu espero conseguir com isso agora?</li><li>Que emoção ou situação antecedeu esse pensamento?</li><li>Que atitude pequena se aproxima da pessoa que quero ser?</li></ol></section>
        <section class="panel"><h2>Se houve consumo</h2><p class="description">Interrompa quando perceber, registre o contexto, cuide do seu corpo e volte à rotina. Não tente compensar com punição ou manobras físicas. Uma recaída não apaga esforços anteriores.</p><button class="btn btn-ghost" data-action="today-checkin">Registrar meu dia</button></section>
        <section class="panel"><h2>Apoio humano</h2><p class="description">Se o comportamento causar sofrimento intenso ou prejuízo frequente, procure um profissional de saúde mental. Se estiver em risco imediato, busque atendimento de emergência. No Brasil, o CVV oferece acolhimento pelo telefone 188.</p></section>`;
      }
      function statsPage(){
        const last30=daysBack(30),e30=last30.map(d=>app.entries[d]).filter(e=>e?.status),s=summaryFor(30);

        const avg=urgeValues.length?(urgeValues.reduce((a,b)=>a+b,0)/urgeValues.length).toFixed(1).replace('.',','):'—';
        const sorted=F.counts(last30.flatMap(d=>app.entries[d]?.triggers||[]));
        const max=Math.max(1,...sorted.map(([,v])=>v));
        return `<h1 class="section-title">Sua evolução</h1><p class="section-sub">Últimos 30 dias, considerando apenas os que você registrou.</p>${weeklyHTML()}${achievementsHTML()}<div class="cards"><div class="stat"><div class="stat-label">Dias registrados</div><div class="stat-val">${s.registered}</div></div><div class="stat"><div class="stat-label">Sem consumo</div><div class="stat-val" style="color:var(--mint)">${s.done}</div></div><div class="stat"><div class="stat-label">Com consumo</div><div class="stat-val" style="color:var(--coral)">${s.slip}</div></div></div>
        <div class="small-metrics"><div class="stat"><div class="stat-label">Intensidade média registrada</div><div class="stat-val">${avg}</div><div class="stat-detail">${urgeValues.length} avaliações</div></div><div class="stat"><div class="stat-label">Dias sem consumo dentre os registrados</div><div class="stat-val">${s.registered?Math.round(s.done/s.registered*100)+'%':'—'}</div><div class="stat-detail">Não considera dias sem registro</div></div></div>
        <section class="panel"><h2>Últimos 14 dias</h2><p class="description">Altura = vontade registrada (de 0 a 10); cor = status do dia. Ausência de dados não é contada como dia sem consumo.</p>
        <div class="timeline" role="img" aria-label="Intensidade da vontade e status nos últimos 14 dias">${daysBack(14).map(d=>{const e=app.entries[d],height=e?.urge==null?6:Math.max(6,e.urge*10+5),cls=e?.status|| (e?'partial':'');return `<div class="timeline-day" title="${escapeHTML(displayDate(d))}: ${e?.urge==null?'sem avaliação':e.urge+'/10'}"><div class="timeline-bar ${cls}" style="height:${height}px"></div><div class="timeline-label">${parseDate(d).getDate()}</div></div>`;}).join('')}</div>
        <div class="legend"><span class="legend-item"><span class="swatch done"></span>Sem consumo</span><span class="legend-item"><span class="swatch slip"></span>Houve consumo</span><span class="legend-item"><span class="swatch partial"></span>Parcial</span></div></section>
        <section class="panel"><h2>Habilidades praticadas</h2><p class="description">Nos últimos 30 dias, entre registros em que a pergunta foi respondida.</p>
        <div class="small-metrics"><div class="stat"><div class="stat-label">Dias em que interrompi um impulso</div><div class="stat-val">${last30.filter(d=>app.entries[d]?.interrupt==='yes').length}</div><div class="stat-detail">Contagem, não diagnóstico</div></div><div class="stat"><div class="stat-label">Dias em que alternativas ajudaram</div><div class="stat-val">${last30.filter(d=>app.entries[d]?.coping==='helped').length}</div><div class="stat-detail">Autopercepção registrada</div></div></div>
        <div class="stat"><div class="stat-label">Sofrimento médio informado</div><div class="stat-val">${(()=>{const v=last30.map(d=>app.entries[d]?.distress).filter(Number.isInteger);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1).replace('.',',')+'/10':'—';})()}</div><div class="stat-detail">Somente dias avaliados</div></div></section>
        <section class="panel"><h2>Gatilhos mais frequentes</h2><p class="description">Contagem das vezes em que cada gatilho foi marcado nos últimos 30 dias.</p>${sorted.length?sorted.map(([key,num])=>`<div class="chart-row"><div class="bar-label">${escapeHTML(key)}</div><div class="bar-track"><div class="bar-fill" style="width:${(num/max*100).toFixed(1)}%"></div></div><div class="bar-value">${num}</div></div>`).join(''):'<div class="no-data">Quando você registrar seus gatilhos, eles aparecerão aqui.</div>'}</section>
        <section class="panel"><h2>O que os números mostram?</h2><p class="description">${s.registered?`Você registrou ${s.registered} dia(s) e marcou ${s.done} sem consumo. Continue observando as situações que facilitam suas escolhas.`:'Ainda não há dias com status registrados neste período. Um único check-in já é um começo.'}</p><p class="soft-note">Esses números são apenas uma ferramenta de autoconhecimento. Não são diagnóstico nem medida do seu valor pessoal.</p></section>`;
      }
      function rememberDraft(){const entry=readForm();if(entry){entry.updatedAt=app.entries[app.selected]?.updatedAt||'';checkinDraft={date:app.selected,entry};}}
      function progressHTML(){

      }

        <details class="panel feature-details" id="plan-settings"><summary>Meu plano para momentos de risco</summary><label class="checkline" for="plan-trigger">Quando eu perceber…</label><input class="new-input" id="plan-trigger" type="text" maxlength="120" placeholder="Ex.: estar sozinho e cansado no computador" value="${escapeHTML(prefs.planTrigger||'')}"><label class="checkline" for="plan-action">Eu vou…</label><textarea id="plan-action" maxlength="300" placeholder="Ex.: levantar e caminhar por dez minutos longe das telas">${escapeHTML(prefs.planAction||'')}</textarea><button class="btn btn-primary" data-action="save-plan">Salvar meu plano</button><p class="soft-note">Seu plano aparece na Ajuda rápida. Os dois campos podem ficar vazios se você não quiser usar essa função.</p></details>
        <details class="panel feature-details"><summary>Check-in e conquistas</summary><label class="checkline"><input type="checkbox" id="pref-quick" ${prefs.quickMode?'checked':''}> Abrir o check-in no modo rápido</label><label class="checkline"><input type="checkbox" id="pref-achievements" ${prefs.showAchievements!==false?'checked':''}> Mostrar conquistas na Evolução</label><label class="checkline"><input type="checkbox" id="pref-counter" ${prefs.showCounter!==false?'checked':''}> Mostrar contagem acumulada no calendário</label><button class="btn btn-primary" data-action="save-display">Salvar preferências</button><p class="soft-note">No modo rápido, os detalhes ficam recolhidos e continuam disponíveis. Ocultar conquistas não apaga as já reconhecidas.</p></details>

      function settingsPage(){
        const total=Object.keys(app.entries).length;
        return `<h1 class="section-title">Seus dados e sua privacidade</h1><p class="section-sub">Você controla as informações registradas aqui.</p>${settingsExtras()}

      function readForm(){

          status:data.get('status')==='none'?null:data.get('status'),
          urge:document.getElementById('urge-known')?.checked?Number(document.getElementById('urge-input').value):null,
          triggers:data.getAll('triggers'),
          habits:Object.fromEntries(habits.map(([key])=>[key,data.has('habit-'+key)])),
          bathroom:data.get('bathroom')==='unreported'?null:data.get('bathroom'),
          distress:document.getElementById('distress-known')?.checked?Number(document.getElementById('distress-input').value):null,
          interrupt:data.get('interrupt')||null,
          coping:data.get('coping')||null,
          strategy:String(data.get('strategy')||''),note:String(data.get('note')||''),updatedAt:new Date().toISOString()

      function storeCheckin(){

        const previous=app.entries[app.selected];app.entries[app.selected]=entry;
        if(!save()){if(previous)app.entries[app.selected]=previous;else delete app.entries[app.selected];return false;}
        checkinDraft=null;
        document.getElementById('save-indicator').textContent='✓ Registro salvo neste aparelho.';
        const form=document.getElementById('checkin-form');

      }

          `Status: ${labels[entry.status]||'Não avaliado'}\n`+
          `Vontade máxima: ${entry.urge==null?'Não avaliada':entry.urge+'/10'}\n`+

          `Sofrimento: ${entry.distress==null?'Não avaliado':entry.distress+'/10'}\n`+
          `Consegui interromper impulso: ${{yes:'Sim',no:'Não',notneeded:'Não precisei'}[entry.interrupt]||'Não avaliado'}\n`+
          `Estratégias alternativas: ${{helped:'Ajudaram',tried:'Tentei, foi difícil',nottried:'Não tentei'}[entry.coping]||'Não avaliado'}\n`+
          `Alternativa utilizada: ${entry.strategy||'Não informada'}\n`+
          `Hábitos: \n${habits.map(([key,label])=>'['+(entry.habits[key]?'x':' ')+'] '+label).join('\n')}\n`+
          `Observações: ${entry.note||'Nenhuma'}\n`+

      async function copyText(s,successMessage='Copiado! Agora cole na nossa conversa.'){
        if(window.RumoAndroid && typeof window.RumoAndroid.copyText==='function'){
          window.RumoAndroid.copyText(s);
          toast(successMessage);
          return;
        }
        try {await navigator.clipboard.writeText(s);toast(successMessage);}
        catch(e){
          const t=document.createElement('textarea');t.value=s;t.setAttribute('readonly','');t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();
          try {if(document.execCommand('copy'))toast(successMessage);else throw new Error('Falha');}
          catch(err){toast('Não foi possível copiar neste navegador.');}finally{t.remove();}
        }
      }
      function downloadBlob(filename,blob){
        if(window.RumoAndroid && typeof window.RumoAndroid.saveFile==='function'){
          blob.text().then(content=>window.RumoAndroid.saveFile(filename,blob.type||'application/octet-stream',content))
            .catch(()=>toast('Não foi possível preparar o arquivo.'));
          return;
        }
        const url=URL.createObjectURL(blob),link=document.createElement('a');
        link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
      }
      function backupPayload(){return {app:'Rumo',version:3,exportedAt:new Date().toISOString(),entries:app.entries,preferences:{...prefs},achievements:ledger};}
      function exportJSON(){if(!confirm('Backup sem criptografia: seus registros poderão ser lidos por quem tiver este arquivo. Deseja continuar?'))return;const payload=backupPayload();downloadBlob('rumo-backup-'+today()+'.json',new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}));toast(window.RumoAndroid?'Escolha onde salvar o backup.':'Cópia de segurança criada.');}
      function exportCSV(){
        if(!confirm('O CSV contém informações íntimas sem criptografia. Deseja continuar?'))return;
        const headers=['Data','Status','Vontade máxima','Gatilhos','Banheiro','Sofrimento','Interrompi impulso','Estratégias','Alternativa utilizada',...habits.map(([,label])=>label),'Observações'];
        const rows=Object.entries(app.entries).sort(([a],[b])=>a.localeCompare(b)).map(([date,e])=>[date,e.status==='done'?'Sem consumo':e.status==='slip'?'Houve consumo':'Não avaliado',e.urge??'',e.triggers.join('; '),e.bathroom||'',e.distress??'',e.interrupt||'',e.coping||'',e.strategy||'',...habits.map(([key])=>e.habits[key]?'Sim':'Não'),e.note]);
        const q=x=>{let v=String(x??'');if(/^[=+@\-\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};
        const csv='\ufeff'+[headers,...rows].map(row=>row.map(q).join(',')).join('\r\n');
        downloadBlob('rumo-registros-'+today()+'.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}));toast(window.RumoAndroid?'Escolha onde salvar o CSV.':'CSV exportado.');
      }
      const bytesTo64=bytes=>{let text='';for(let i=0;i<bytes.length;i+=32768)text+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(text);};
      const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
      async function keyFromPassword(password,salt){
        const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
        return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
      }
      async function exportSecure(){
        if(!crypto?.subtle){toast('Criptografia indisponível neste aparelho.');return;}
        const password=prompt('Crie uma senha forte (mínimo 10 caracteres) para proteger este backup:');
        if(password===null)return;
        if(password.length<10){toast('Escolha pelo menos 10 caracteres.');return;}
        const again=prompt('Repita a senha do backup:');
        if(again!==password){toast('As senhas não conferem.');return;}
        try{
          const salt=crypto.getRandomValues(new Uint8Array(16));
          const iv=crypto.getRandomValues(new Uint8Array(12));
          const key=await keyFromPassword(password,salt);
          const payload=backupPayload();
          const cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(payload))));
          const safe={app:'Rumo',version:2,encrypted:true,kdf:'PBKDF2-SHA256',iterations:250000,algorithm:'AES-256-GCM',salt:bytesTo64(salt),iv:bytesTo64(iv),ciphertext:bytesTo64(cipher)};
          downloadBlob('rumo-backup-protegido-'+today()+'.json',new Blob([JSON.stringify(safe)],{type:'application/json;charset=utf-8'}));
          toast('Escolha onde guardar o backup protegido.');
        }catch(e){toast('Falha ao preparar o backup protegido.');}
      }
      async function decryptBackup(wrapper){
        if(wrapper?.version!==2||wrapper?.algorithm!=='AES-256-GCM'||wrapper?.iterations!==250000||wrapper?.kdf!=='PBKDF2-SHA256')throw Error('Formato de criptografia incompatível');
        const salt=from64(wrapper.salt||''),iv=from64(wrapper.iv||''),ciphertext=from64(wrapper.ciphertext||'');
        if(salt.length!==16||iv.length!==12||ciphertext.length<16)throw Error('Cópia inválida');
        const password=prompt('Senha para desbloquear esta cópia de segurança:');
        if(password===null)throw Error('Cancelado');
        const key=await keyFromPassword(password,salt);
        const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ciphertext);
        return JSON.parse(new TextDecoder().decode(clear));
      }
      async function importJSON(file){
        if(!file)return;
        try {
          if(file.size>12000000)throw new Error('Arquivo grande demais');
          let raw=JSON.parse(await file.text());
          if(raw?.encrypted===true)raw=await decryptBackup(raw);
          if(raw?.app!=='Rumo'||![1,2,3].includes(raw?.version)||!raw.entries||typeof raw.entries!=='object'||Array.isArray(raw.entries))throw new Error('Formato inválido');
          const clean={};for(const [date,e]of Object.entries(raw.entries)){if(!isISO(date)||date>today()||!e||typeof e!=='object')continue;clean[date]=sanitizeEntry(e);}
          const count=Object.keys(clean).length;
          const hasPrefs=raw.version===3&&raw.preferences&&typeof raw.preferences==='object'&&!Array.isArray(raw.preferences);
          if(!confirm(`Importar ${count} registro(s)${hasPrefs?' e preferências':''}? Dias já existentes serão substituídos pelos da cópia. Os demais serão preservados. PIN e biometria não são alterados. Ao restaurar preferências, lembretes e contagem do widget ficam desligados até você ativá-los novamente.`))return;
          const entries={...app.entries,...clean};
          let nextPrefs={...prefs};
          if(hasPrefs){const p=raw.preferences;nextPrefs={...nextPrefs,
            theme:themes.includes(p.theme)?p.theme:nextPrefs.theme,customTriggers:F.labels(p.customTriggers,30),
            planTrigger:F.text(p.planTrigger,120),planAction:F.text(p.planAction,300),quickMode:p.quickMode===true,
            showAchievements:p.showAchievements!==false,showCounter:p.showCounter!==false,
            widgetMode:['total','registered','sequence'].includes(p.widgetMode)?p.widgetMode:'total',widgetEnabled:false,reminderCount:0,
            reminderTimes:defaults.reminderTimes.map((d,i)=>safeTime(p.reminderTimes?.[i],d))};}
          const incoming=F.cleanLedger(raw.achievements,today());
          const nextLedger=F.award({version:1,unlocked:{...incoming.unlocked,...ledger.unlocked}},F.progress(entries,today()),today());
          persistBundle({[STORAGE_KEY]:JSON.stringify(entries),[PREFS_KEY]:JSON.stringify(nextPrefs),[LEDGER_KEY]:JSON.stringify(nextLedger)});
          app.entries=entries;prefs=nextPrefs;ledger=nextLedger;checkinDraft=null;applyTheme();updateProgress();
          if(hasPrefs&&typeof window.RumoAndroid?.configureReminders==='function')window.RumoAndroid.configureReminders(0,prefs.reminderTimes.join(','));
          render();toast(`${count} registro(s) importado(s).`);
        }catch(e){toast('Não foi possível importar. Verifique a cópia JSON do Rumo.');}
      }

      updateProgress();
      render();
      if(!window.RumoAndroid && 'serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
      }catch(error){
        window.__rumoBootError=String(error?.message||error);
        const view=document.getElementById('view');
        if(view)view.innerHTML='<section class="panel"><h1>Seus dados foram preservados</h1><p>Não foi possível abrir o diário com segurança. Feche e abra o aplicativo. Se continuar, preserve seu backup externo e procure suporte antes de limpar dados ou reinstalar.</p></section>';
      }
    })();
  </script>
</body>
</html>
