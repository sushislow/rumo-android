name: Gerar APK do Rumo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testar lógica do diário
        run: |
          node tests/rumo-smoke.js
          node tests/rumo-features.js
          mkdir -p "$RUNNER_TEMP/rumo-crypto-tests"
          javac -d "$RUNNER_TEMP/rumo-crypto-tests" app/src/main/java/br/com/rumo/diario/VaultCrypto.java tests/VaultCryptoTest.java
          java -cp "$RUNNER_TEMP/rumo-crypto-tests" br.com.rumo.diario.VaultCryptoTest
      - name: Testar campos de senha e temas
        run: |
          npm install --prefix "$RUNNER_TEMP/rumo-ui" jsdom@26.1.0 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/rumo-ui/node_modules" node tests/security-ui.cjs
      - name: Gerar APK de testes
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Rumo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
