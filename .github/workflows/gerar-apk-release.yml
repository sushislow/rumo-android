name: Gerar APK de release assinado

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Conferir segredos de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.RUMO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RUMO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RUMO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RUMO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Configurar os 4 segredos RUMO_* no repositório para gerar APK assinado." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rumo-upload.jks"
          chmod 600 "$RUNNER_TEMP/rumo-upload.jks"
          test -s "$RUNNER_TEMP/rumo-upload.jks"
      - name: Testar lógica do diário
        run: |
          node tests/rumo-smoke.js
          node tests/rumo-features.js
          mkdir -p "$RUNNER_TEMP/rumo-crypto-tests"
          javac -d "$RUNNER_TEMP/rumo-crypto-tests" app/src/main/java/br/com/rumo/diario/VaultCrypto.java tests/VaultCryptoTest.java
          java -cp "$RUNNER_TEMP/rumo-crypto-tests" br.com.rumo.diario.VaultCryptoTest
      - name: Testar campos de senha e temas
        run: |
          npm install --prefix "$RUNNER_TEMP/rumo-ui" jsdom@26.1.0 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/rumo-ui/node_modules" node tests/security-ui.cjs
      - name: Compilar APK de release
        env:
          RUMO_KEYSTORE_PATH: ${{ runner.temp }}/rumo-upload.jks
          RUMO_KEYSTORE_PASSWORD: ${{ secrets.RUMO_KEYSTORE_PASSWORD }}
          RUMO_KEY_ALIAS: ${{ secrets.RUMO_KEY_ALIAS }}
          RUMO_KEY_PASSWORD: ${{ secrets.RUMO_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Publicar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: Rumo-Release-Assinado
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
